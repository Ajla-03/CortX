<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CortX">
<title>CortX</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080a;--ink:#e8efe4;--mut:#8a9786;--card:#0d1210;--line:#222d1f;--acc:#c6ff3d;--mem:#35c8ff;--rea:#ff9f1a;--cri:#c6ff3d;--exe:#2fe6b4;--mot:#ff5a5a;--spa:#ffe94d;--lan:#7a7cff;--occ:#ff3d9a;--cbl:#d27bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column}
main{flex:1;overflow:auto;padding:20px 18px;max-width:520px;width:100%;margin:0 auto}
h1{font-size:26px;line-height:1.15;font-weight:800;margin:6px 0 10px;letter-spacing:-.03em}
h2{font-size:22px;margin:4px 0 14px}h3{margin:0 0 4px;font-size:18px}
p{margin:0 0 10px}.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:14px;justify-content:space-between;align-items:center;padding:14px 0 14px 14px;border-bottom:1px solid var(--line);border-left:6px solid var(--c)}
.sc{text-align:center;min-width:88px}.sc b{display:block;font-size:30px;font-weight:800;color:var(--c);line-height:1.1}
.btn{font:inherit;font-weight:600;background:var(--acc);color:#06080a;border:0;border-radius:0;padding:13px 18px;width:100%;margin-top:8px}
.btn.sm{padding:8px 12px;font-size:14px;width:auto}

.btn,.tab,.quit{transition:background .15s,color .15s,border-color .15s;cursor:pointer}
.btn:active{opacity:.85}
@media(hover:hover){.btn:hover{background:var(--mut);color:var(--bg)}.btn.alt:hover{background:var(--line);color:var(--ink);border-color:var(--mut)}.tab:hover,.quit:hover{background:var(--line);color:var(--ink)}}
.btn:focus-visible,.f:focus-visible,.inp:focus-visible,.tab:focus-visible,.quit:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
nav{display:flex;border-top:1px solid var(--line);background:#000}
.tab{flex:1;background:none;border:0;font:inherit;padding:14px 0;color:var(--mut);font-weight:600}
.tab.on{color:var(--acc);box-shadow:inset 0 2px var(--acc)}
#stage{position:fixed;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#stage[hidden]{display:none}
#stage header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-weight:600}
#stage .body{flex:1;min-height:0;padding:10px 18px 24px;max-width:520px;width:100%;margin:0 auto;overflow:auto}
.sw{flex:1;display:flex;flex-direction:column;min-height:0}
.plan{flex:none;background:#000;border-bottom:1px solid var(--line);padding:10px 18px;font-size:12.5px;max-height:55vh;overflow:auto}
.pl-seg{display:flex;gap:3px;margin-bottom:8px}.pl-seg i{flex:1;height:5px;background:var(--line)}.pl-seg i.done{background:var(--c)}.pl-seg i.now{background:var(--ink)}
.pl-mini{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.pl-mini p{margin:0}.pl-mini b{color:var(--ink)}.pl-mini .mut{font-size:12px}
.pl-tg{font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--mut);padding:4px 8px;cursor:pointer;white-space:nowrap}
.pl-list{list-style:none;padding:0;margin:10px 0 0;display:none}.plan.open .pl-list{display:block}
.pl-list li{display:flex;gap:10px;align-items:baseline;padding:7px 0 7px 10px;margin:0 0 3px;border-left:3px solid var(--line);color:var(--mut)}
.pl-list li span{min-width:16px;font-weight:800}.pl-list li b{display:block;font-weight:600}.pl-list li small{font-size:11px}
.pl-list li.pl-done{border-left-color:var(--c)}.pl-list li.pl-done b{text-decoration:line-through;text-decoration-color:var(--mut)}
.pl-list li.pl-now{border-left-color:var(--c);background:var(--card);color:var(--ink)}.pl-list li.pl-now small{color:var(--c)}
@media(min-width:860px){.sw{flex-direction:row}.plan{width:270px;max-height:none;border-bottom:0;border-right:1px solid var(--line);padding:16px 18px}.pl-tg{display:none}.pl-list{display:block}}
.quit{background:none;border:0;color:var(--mut);font:inherit;padding:6px 10px}
.big{font-size:96px;font-weight:800;text-align:center;margin:60px 0;min-height:110px;line-height:1}
.cdn{width:120px;height:120px;border-radius:50%;border:3px solid var(--acc);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;margin:50px auto}
.chip{font:inherit;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:0;padding:6px 10px;font-size:12px;margin:0 6px 6px 0;cursor:pointer}.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}.chip.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.q{font-size:20px;font-weight:600;margin-bottom:14px}
.inp{font:inherit;font-size:28px;width:100%;padding:12px;border:1px solid var(--line);border-radius:0;background:var(--card);color:var(--ink);text-align:center;letter-spacing:.2em}
.pad{text-align:center;padding:0 16px;height:260px;border-radius:0;background:var(--card);border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;margin-bottom:14px;user-select:none;touch-action:manipulation}.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:6px 0 0}.pass{display:block;font-weight:400;font-size:15px;color:var(--mut);border-left:3px solid var(--line);padding-left:10px;margin-bottom:12px}.dot{width:22px;height:22px;border-radius:50%;margin:0 auto 14px;background:#1c2519}.dot.hi{background:#3b4a33}
.opts4{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.mg{display:inline-grid;grid-template-columns:repeat(var(--n,4),var(--s,18px));gap:2px;padding:4px;background:#000;margin:2px}.mg i{width:var(--s,18px);height:var(--s,18px);background:var(--line)}.mg i.on{background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.cell{font:inherit;font-size:26px;font-weight:600;background:var(--card);color:var(--ink);border:1px solid var(--line);aspect-ratio:1;padding:0;cursor:pointer}
.cell{-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}.cell span{display:inline-block;line-height:1}.cell:disabled{opacity:1}.g6{grid-template-columns:repeat(6,1fr);gap:4px}.g6 .cell{font-size:22px}
label{display:block;margin:12px 0 4px;font-weight:600}
.f{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:0;background:var(--card);color:var(--ink)}
.blk{padding:14px 0;border-bottom:1px solid var(--line)}
.bar{height:6px;background:var(--line);border-radius:0;margin:0 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-bottom:10px}.stats div{padding:7px 9px;border-right:1px solid var(--line)}.stats div:last-child{border:0}.stats small{display:block;color:var(--mut);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}.stats b{font-size:19px;color:var(--acc);font-weight:800}
.cortex{position:relative;border:1px solid var(--line);background:#000;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px}.cortex canvas{display:block;width:100%;aspect-ratio:5/4;touch-action:none;cursor:grab}
.ctag{position:absolute;top:8px;left:8px;z-index:1;background:var(--acc);color:#06080a;font-size:10.5px;font-weight:800;padding:2px 7px;pointer-events:none}
.ov.on{border-color:var(--acc)}.ov{border:1px solid var(--line);padding:12px;margin-bottom:8px}.ovh{display:flex;justify-content:space-between;align-items:baseline}.ovh b{font-size:34px;color:var(--acc);font-weight:800}.obar{height:10px;background:var(--line)}.obar i{display:block;height:100%;background:var(--acc)}
.srow{display:grid;grid-template-columns:1.2fr 1fr auto;gap:12px;align-items:center;width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);padding:10px 12px;margin-bottom:6px;text-align:left;cursor:pointer}
.sn small{display:block;color:var(--mut);font-size:11px}.sb{position:relative;height:8px;background:var(--line)}.sb i{display:block;height:100%;background:var(--c)}.sb u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff}
.sv{font-size:18px;font-weight:800;color:var(--c);text-align:right}.sv small{display:block;font-size:11px;color:var(--mut);font-weight:400}
@media(hover:hover){.srow:hover{background:var(--line)}}
.log{border:1px solid var(--line);padding:9px 12px;font-size:11.5px;color:var(--mut);margin-top:12px;line-height:1.7}.log b{color:var(--acc)}.log em{font-style:normal;color:var(--ink)}
ul{padding-left:20px;margin:0 0 10px}li{margin-bottom:6px}
button{-webkit-tap-highlight-color:transparent}
#stage [data-j].btn.alt:hover{background:var(--card);color:var(--ink);border-color:var(--line)}
#stage [data-j].btn.alt:active,.cell:active{background:var(--line)}
.cell:focus{outline:none}.cell:focus-visible{outline:2px solid var(--acc)}
.cell.hit{box-shadow:inset 0 0 0 3px var(--exe)}.cell.miss{box-shadow:inset 0 0 0 3px var(--mot)}
.fb{min-height:24px;margin:10px 0 0;font-weight:600;text-align:center}.fb.ok{color:var(--exe)}.fb.no{color:var(--mot)}
.reg{border-left:4px solid var(--c);background:var(--card);padding:10px 12px;margin:0 0 12px}.reg small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.reg b{display:block;color:var(--c);font-size:16px}.reg span{display:block;font-size:13.5px;color:var(--mut);margin-top:2px}
.ex{border:1px dashed var(--mut);padding:10px 12px;margin:0 0 12px}.ex>small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.exs{text-align:center;margin:8px 0}.ex p:last-child{margin:0;font-size:13.5px}.ex li{font-size:13.5px}.ex2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tsb{display:flex;align-items:center;justify-content:center;width:180px;height:180px;border-radius:50%;margin:26px auto 12px;font:inherit;font-size:26px;font-weight:800;background:var(--card);color:var(--acc);border:3px solid var(--acc);cursor:pointer;touch-action:manipulation;user-select:none}.tsb.run{color:var(--mot);border-color:var(--mot);background:#1a0c0c}
.rv{border:1px solid var(--line);border-left:4px solid var(--c2);padding:10px 12px;margin-bottom:10px}.rv.ok{--c2:var(--exe)}.rv.no{--c2:var(--mot)}
.rvh{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--c2);margin-bottom:6px}.rvq{font-weight:600}
.rvo{list-style:none;padding:0;margin:0}.rvo li{padding:8px 0;margin:0;border-top:1px solid var(--line);font-size:13.5px;color:var(--mut)}.rvo li b{font-weight:600;color:var(--ink)}.rvo li.a b{color:var(--exe)}.rvo li.u:not(.a) b{color:var(--mot)}
.rvo li small{font-size:10px;text-transform:uppercase;letter-spacing:.06em;border:1px solid currentColor;padding:0 4px;margin-left:6px;white-space:nowrap}.rvo li.a small{color:var(--exe)}.rvo li.u:not(.a) small{color:var(--mot)}.rvo li span{display:block;margin-top:3px}
.rsum{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0 10px 12px;border-left:4px solid var(--c);border-bottom:1px solid var(--line)}.rsum small{display:block;color:var(--mut);font-size:11px}.rsv{font-size:20px;font-weight:800;color:var(--c);text-align:right}.rsv small{font-weight:400}
.pl-redo{margin-left:auto;align-self:center;font:inherit;font-size:11px;background:none;border:1px solid var(--line);color:var(--mut);padding:3px 8px;cursor:pointer}@media(hover:hover){.pl-redo:hover{color:var(--ink);border-color:var(--mut)}}
.pl-list li small.rg{display:block;font-size:10.5px;opacity:.8}
</style></head>
<body>
<main id="main"></main>
<nav id="nav"></nav>
<div id="stage" hidden></div>
<script>
const $=s=>document.querySelector(s);
const CATS={cri:{n:"Critical thinking",c:"var(--cri)"},exe:{n:"Focus",c:"var(--exe)"},mot:{n:"Tapping speed",c:"var(--mot)"},rea:{n:"Reasoning",c:"var(--rea)"},spa:{n:"Mental rotation",c:"var(--spa)"},mem:{n:"Memory",c:"var(--mem)"},lan:{n:"Vocabulary",c:"var(--lan)"},occ:{n:"Visual search",c:"var(--occ)"},cbl:{n:"Timing",c:"var(--cbl)"}};
const KEYS=Object.keys(CATS),K="braincamp.v1";
let S={base:null,hist:[],log:{}},tab="brain",curCat="mem";
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
if(S.base&&KEYS.some(k=>S.base[k]==null)){S.base=null;S.hist=[];S.pre={};S.note=1;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
S.pre=S.pre||{};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toLocaleDateString("en-CA");
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
const cur=c=>{const h=S.hist.filter(x=>x.c===c).slice(-3).map(x=>x.s);return avg(h)};
const doneToday=c=>S.hist.some(x=>x.c===c&&x.d===today());
const overall=()=>avg(KEYS.map(cur).filter(x=>x!=null));
const TIPS={
mem:["Retell what you just read in your own words, out loud.","Review new material after 1 day, 3 days, and 7 days.","Place facts along a mental walk through a familiar room."],
rea:["Solve one puzzle a day and explain your steps before checking.","Before answering, write down what stays the same and what changes.","Practice estimating: guess a number, then check how close you were."],
cri:["For any claim, ask what evidence would change your mind.","Look for a second explanation before accepting the first.","Read one opinion you disagree with and state its best point."],
occ:["Scan a busy page for one detail, like a word or a color, and time yourself.","Look away from screens every 20 minutes and focus on something far away.","Do a spot-the-difference puzzle or a visual maze each day."],
cbl:["Tap or clap along to a song, then try holding the beat when it stops.","Practice a balance move, like standing on one foot, for a minute a day.","Learn something hands-on, like juggling, drumming, or an instrument."],
exe:["Work on one task for 25 minutes with notifications off, then take a short break.","Practice the color-word idea: name the ink color of words printed in a different color.","Take one breath before answering a tough message or decision."],
mot:["Practice finger tapping or drumming on a table in short bursts.","Learn a hands-on skill like typing, piano, or knitting.","Do small everyday tasks with your other hand."],
spa:["Try jigsaw or tangram puzzles, and mentally rotate objects around you.","Use a paper map instead of GPS now and then.","Sketch a familiar room from memory, then check it."],
lan:["Learn three new words a day and use each in a sentence.","Read something a little above your level for 15 minutes.","Look up the words you skip over while reading."]};
const INTRO={
mem:"Digits flash one at a time. Type them back in order. Eight rounds, from 3 digits up to 7. You press Show for each round.",
rea:"Eight pattern questions that get harder: number rules first, then growing and mixed rules, then letters. Pick what comes next.",
cri:"Ten questions in four levels that get much harder: basic logic, flawed arguments, evidence and data, then hard reasoning like base rates, hidden selection effects and logic puzzles. Afterward you see every question with why each answer is right or wrong.",
occ:"Twelve grids in three phases: spot the odd symbol, find an exact shape and color, then find a mirrored letter. Grids get bigger. Each grid is timed from when it appears. After each tap you see whether you were right, then the next grid follows.",
cbl:"Three parts. Tap with a beat, keep a beat going after it stops, then judge short stretches of time with a Start and Stop button. You press Start for every trial.",
exe:"Three stages: name the ink color of a word, pick the direction of a middle arrow, then switch between an INK rule and a WORD rule. Thirty trials.",
mot:"Tap a pad as fast as you can for 10 seconds with each hand, using one index finger. Your dominant hand goes first. The timer starts at your first tap.",
spa:"You will see an example of turned versus flipped patterns first. Then eight questions on bigger and bigger grids. No timer.",
lan:"Sixteen questions in four parts: word meanings, sentences in context, analogies, and reading passages. They get harder as you go."};
function stage(html,noctl){const s=$("#stage");s.hidden=false;
 const ctl=stepFn&&!noctl?`<button class="quit" id="pz">Pause</button><button class="quit" id="rs">Restart</button>`:"";
 s.innerHTML=`<header><span>${curName}${part&&!bl?", "+part:""}</span><span>${ctl}<button class="quit" id="quit">Quit</button></span></header><div class="sw">${planHTML()}<div class="body">${html}</div></div>`;
 const tg=$("#pltg");if(tg)tg.onclick=()=>{plOpen=!plOpen;$(".plan").classList.toggle("open",plOpen);tg.textContent=plOpen?"Hide":"All sections";tg.setAttribute("aria-expanded",plOpen)};
 $("#quit").onclick=()=>{gen++;stepFn=null;bl=null;s.hidden=true;render()};
 s.querySelectorAll("[data-redo]").forEach(b=>b.onclick=()=>{gen++;stepFn=null;bRun(b.dataset.redo)});
 const ae=document.activeElement;if(ae&&ae!==document.body&&!s.contains(ae))ae.blur();s.querySelector(".body").scrollTop=0;
 if(ctl){$("#pz").onclick=pause;$("#rs").onclick=restart}}
let curName="",part="",stepFn=null,gen=0,curRun=null,bl=null,plOpen=false,blRun=false;
const MIN=k=>+((META[k].match(/about (\d+) minute/)||[0,0])[1]);
const totMin=()=>KEYS.reduce((a,k)=>a+MIN(k),0);
function planHTML(){if(!bl)return"";
 const st=k=>k===bl&&blRun?"now":S.pre[k]!=null?"done":"next",now=KEYS.find(k=>st(k)==="now"),nxt=KEYS.find(k=>st(k)==="next"),left=KEYS.filter(k=>st(k)!=="done").reduce((a,k)=>a+MIN(k),0),nd=KEYS.filter(k=>st(k)==="done").length;
 const seg=`<div class="pl-seg" aria-hidden="true">${KEYS.map(k=>`<i class="${st(k)}" style="--c:${CATS[k].c}"></i>`).join("")}</div>`;
 const l1=!now&&nd===KEYS.length?`<p><b>All ${KEYS.length} sections done</b></p>`:now?`<p>Now: <b>${CATS[now].n}</b> · about ${MIN(now)} min</p>`:`<p>Finished: <b>${CATS[bl].n}</b> · ${S.pre[bl]} / 100</p>`;
 const l2=!now&&nd===KEYS.length?`<p class="mut">Redo any section, then save your baseline.</p>`:nxt?`<p class="mut">Next: ${CATS[nxt].n} · about ${MIN(nxt)} min</p>`:`<p class="mut">${now?"Last section":"All sections done"}</p>`;
 const l3=`<p class="mut">${nd} of ${KEYS.length} done${left?` · about ${left} min left`:""}</p>`;
 const li=KEYS.map((k,i)=>{const s=st(k);return`<li class="pl-${s}" style="--c:${CATS[k].c}"${s==="now"?' aria-current="step"':""}><span>${i+1}</span><div><b>${CATS[k].n}</b><small class="rg">${ANAT[k]}</small><small>${s==="done"?`Done · ${S.pre[k]} / 100`:s==="now"?`In progress · about ${MIN(k)} min`:`About ${MIN(k)} min`}</small></div>${s==="done"?`<button class="pl-redo" data-redo="${k}" aria-label="Redo ${CATS[k].n}">Redo</button>`:""}</li>`}).join("");
 return`<aside class="plan${plOpen?" open":""}" aria-label="Baseline sections">${seg}<div class="pl-mini"><div>${l1}${l2}${l3}</div><button class="pl-tg" id="pltg" aria-expanded="${plOpen}">${plOpen?"Hide":"All sections"}</button></div><ol class="pl-list">${li}</ol></aside>`}
const later=(f,ms)=>{const g=gen;setTimeout(()=>{if(g===gen)f()},ms)};
const pause=()=>{gen++;stage(`<h2>Paused</h2><p>Your place in this task is held. Resuming replays the current step.</p><button class="btn" id="rz">Resume</button><button class="btn alt" id="rs2">Restart this task</button>`,true);$("#rz").onclick=()=>stepFn&&stepFn();$("#rs2").onclick=restart};
const restart=()=>{gen++;stepFn=null;if(curRun)EX[curRun.c](curRun.cb)};
function cd(pre,fn,n=3){stepFn=()=>cd(pre,fn,n);const tick=k=>{stage(pre+`<div class="cdn" role="timer">${k}</div>`);later(k>1?()=>tick(k-1):fn,1000)};tick(n)}
const prog=(d,n,t)=>`<div class="bar" role="progressbar" aria-valuenow="${d}" aria-valuemax="${n}"><i style="width:${Math.round(d/n*100)}%"></i></div><p class="mut">${t}</p>`;
const close=()=>{part="";bl=null;$("#stage").hidden=true;render()};

/* exercises */
const band=s=>s>=80?"Strong":s>=60?"Solid":s>=40?"Developing":"Early";
const STRONG={mem:"You recalled nearly every digit, including on the longest strings.",rea:"You got most questions right, including the hardest ones.",cri:"You got most questions right, including the hardest ones.",spa:"You got most questions right, including the biggest grids.",lan:"You got most questions right, including the hardest ones.",occ:"You found most targets correctly and quickly.",exe:"You answered most trials correctly and quickly.",cbl:"Your timing stayed close to the beat and the target times.",mot:"Your tapping rate was near the top of this test's scale."};

/* memory: fixed 8 rounds */
function exMem(cb){const L=[3,4,4,5,5,6,6,7],TOT=L.reduce((a,b)=>a+b,0);let r=0,hit=0,longest=0;
 const rd=()=>{const n=L[r],pr=prog(r,L.length,`Round ${r+1} of ${L.length}. ${L.length-r-1} to go. This round: ${n} digits.`);
  stepFn=rd;stage(pr+`<p>Round ${r+1}: ${n} digits will appear one at a time. Press Show when you are ready.</p><button class="btn" id="go">Show the digits</button>`);
  $("#go").onclick=()=>show(n,pr)};
 const show=(n,pr)=>{const d=Array.from({length:n},()=>rnd(10)).join("");stepFn=()=>show(n,pr);
  stage(pr+`<p class="big" id="dg"></p><p class="mut" style="text-align:center">Remember the digits</p>`);
  const el=$("#dg"),go=i=>{if(i>=d.length)return ask(d,pr);el.textContent=d[i];later(()=>{el.textContent="";later(()=>go(i+1),250)},650)};go(0)};
 const ask=(d,pr)=>{stepFn=()=>ask(d,pr);stage(pr+`<p>Type the ${d.length} digits in order.</p><input id="in" class="inp" inputmode="numeric" autocomplete="off"><button class="btn" id="ok">Check</button>`);
  $("#in").focus();
  $("#ok").onclick=()=>{const v=$("#in").value.trim();let k=0;for(let i=0;i<d.length;i++)if(v[i]===d[i])k++;hit+=k;if(v===d)longest=Math.max(longest,d.length);r++;
   if(r>=L.length)return cb(Math.round(hit/TOT*100),`${hit} of ${TOT} digits correct. Longest string fully correct: ${longest||"none"}.`);rd()}};
 rd()}

/* multiple choice with weights, no countdown */
function mc(items,cb){let i=0,ok=0,W=0,G=0;const ans=[],tot=items.reduce((a,x)=>a+x.w,0),top=Math.max(...items.map(x=>x.t||0)),pp={},hard=[0,0];
 const q=()=>{stepFn=q;const it=items[i];
  stage(prog(i,items.length,`Question ${i+1} of ${items.length}. ${i+1<items.length?(items.length-i-1)+" to go":"Last question"}.`)+(it.p?`<p class="tag">${it.p}</p>`:"")+`<p class="q">${it.q}</p>`+(it.g?`<div class="opts4">`:"")+it.o.map((o,j)=>`<button class="btn alt" data-j="${j}">${o}</button>`).join("")+(it.g?`</div>`:""));
  document.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{const good=+b.dataset.j===it.a;ans.push({it,j:+b.dataset.j});if(good){G+=it.w;ok++}
   if(it.p){const k=it.p.split("· ").pop();pp[k]=pp[k]||[0,0];pp[k][1]++;if(good)pp[k][0]++}
   if((it.t||0)===top){hard[1]++;if(good)hard[0]++}
   i++;if(i<items.length)q();else{if(items.some(x=>x.x))lastReview=reviewHTML(ans);const pt=Object.keys(pp).length?" "+Object.entries(pp).map(([k,v])=>`${k} ${v[0]}/${v[1]}`).join(", ")+".":"";
    cb(Math.round(G/tot*100),`${ok} of ${items.length} correct. Hardest questions: ${hard[0]} of ${hard[1]}.${pt}`)}})};
 q()}
const prep=(x,t,w,p,g)=>{const ix=shuffle(x.o.map((_,i)=>i));return{q:x.q,o:ix.map(i=>x.o[i]),x:x.x&&ix.map(i=>x.x[i]),a:ix.indexOf(x.a),t,w,p,g}};
const reviewHTML=A=>`<h2 style="margin-top:24px">Question by question</h2><p class="mut">${A.filter(r=>r.j===r.it.a).length} of ${A.length} right. Every answer choice is explained.</p>`+A.map((r,n)=>{const it=r.it,ok=r.j===it.a;
 return`<div class="rv ${ok?"ok":"no"}"><p class="rvh"><b>${ok?"✓ Right":"✗ Wrong"}</b> · Question ${n+1}${it.p?" · "+it.p:""}</p><p class="rvq">${it.q}</p><ul class="rvo">${it.o.map((o,j)=>`<li class="${j===it.a?"a":""}${j===r.j?" u":""}"><b>${j===it.a?"✓":j===r.j?"✗":"·"} ${o}</b>${j===it.a?"<small>Correct answer</small>":""}${j===r.j?"<small>Your answer</small>":""}<span>${it.x?it.x[j]:""}</span></li>`).join("")}</ul></div>`}).join("");
const pickT=(bank,counts,W,p)=>counts.flatMap((n,t)=>shuffle(bank[t]).slice(0,n).map(x=>prep(x,t,W[t],p)));

/* reasoning: progressive levels */
function seqOf(t){const a=2+rnd(8),d=2+rnd(6),e=1+rnd(4);let s=[];
 if(t==0)s=[0,1,2,3,4,5].map(k=>a+d*k);
 else if(t==1){const r=2+rnd(2);s=[0,1,2,3,4,5].map(k=>a*r**k)}
 else if(t==2){s=[a];for(let k=0;k<5;k++)s.push(s[k]+(k%2?e:d))}
 else if(t==3)s=[0,1,2,3,4,5].map(k=>(a+k)**2);
 else if(t==4){s=[a];for(let k=0;k<5;k++)s.push(s[k]+d+k*e)}
 else if(t==5){s=[a,d];while(s.length<6)s.push(s[s.length-1]+s[s.length-2])}
 else if(t==6){s=[a];for(let k=0;k<5;k++)s.push(s[k]*2+(k%2?-1:1)*e)}
 else{const x=[a,a+d,a+2*d],y=[30+e,30+2*e,30+4*e];s=[x[0],y[0],x[1],y[1],x[2],y[2]]}
 return s}
function numItem(t){const s=seqOf(t),sh=t>=4?5:4,ans=s[sh],o=new Set([ans]);
 while(o.size<4){const v=ans+(rnd(9)-4)*(1+rnd(3));if(v>0&&v!==ans)o.add(v)}
 const opts=shuffle([...o]);return{q:`What comes next?<br><b>${s.slice(0,sh).join(", ")}, ?</b>`,o:opts,a:opts.indexOf(ans)}}
function letItem(t){const L="ABCDEFGHIJKLMNOPQRSTUVWXYZ";let s;
 if(t==0){const a=rnd(8),st=2+rnd(3);s=[0,1,2,3,4,5].map(k=>a+st*k)}
 else{const a=rnd(10);s=[a,a+1,a+3,a+6,a+10,a+15]}
 const sh=5,ans=L[s[sh]],o=new Set([ans]);while(o.size<4)o.add(L[Math.max(0,Math.min(25,s[sh]+rnd(7)-3))]);
 const opts=shuffle([...o]);return{q:`What comes next?<br><b>${s.slice(0,sh).map(x=>L[x]).join(", ")}, ?</b>`,o:opts,a:opts.indexOf(ans)}}
function exRea(cb){const LV=[0,1,2,3,4,5,6,7],W=[1,1,1.25,1.25,1.5,1.5,1.75,1.75];
 const it=[numItem(0),numItem(1),numItem(2),numItem(3),numItem(4),numItem(5),letItem(0),Math.random()<.5?letItem(1):numItem(6+rnd(2))];
 mc(it.map((x,i)=>({...x,t:Math.floor(i/2),w:W[i],p:"Level "+(Math.floor(i/2)+1)+" of 4"})),cb)}

const CB=[
[{q:"All bloops are razzies. All razzies are lazzies. Which must be true?",o:["All bloops are lazzies","All lazzies are bloops","Some lazzies aren’t razzies"],a:0,
 x:["Every bloop is a razzie, and every razzie is a lazzie, so every bloop is a lazzie. The chain carries all the way through.","This runs the chain backward. Lazzies are the biggest group; there could be lazzies that are not bloops.","This could be true, but nothing says it must be. Every lazzie might happen to be a razzie."]},
{q:"Some doctors are runners. All runners are early risers. Which must be true?",o:["Some doctors are early risers","All doctors are early risers","Some early risers are not doctors"],a:0,
 x:["The doctors who run are runners, and all runners are early risers, so at least those doctors are early risers.","Only the running doctors are covered. Doctors who don’t run could sleep late.","Possible, but not required. Every early riser might be a doctor for all we know."]},
{q:"Every member of the chess club passed the exam. Sam did not pass. What follows?",o:["Sam is not in the chess club","Sam is in the chess club but had a bad day","Nothing can be concluded about Sam"],a:0,
 x:["If Sam were a member, Sam would have passed. Sam didn’t pass, so Sam can’t be a member. This is called the contrapositive.","This contradicts the first statement. Every member passed, so no member failed.","Something does follow. Failing the exam rules Sam out of the club."]},
{q:"No cats are dogs, and Rex is a dog. Rex is…",o:["Not a cat","A cat","Possibly a cat"],a:0,
 x:["No dog is a cat, and Rex is a dog, so Rex is not a cat.","That would make Rex both a dog and a cat, which the first statement rules out.","There is no room for “possibly”. The statement rules out every dog being a cat."]}],
[{q:"Ice cream sales and drownings both rise in summer. What is the best explanation?",o:["Hot weather drives both","Ice cream causes drowning","Drowning increases ice cream demand"],a:0,
 x:["A third factor, hot weather, sends more people to buy ice cream and to swim. Both rise together without one causing the other.","Rising together is not proof that one causes the other. There is no reasonable way ice cream causes drowning.","This flips the cause the other way, and it is just as unsupported. Neither causes the other."]},
{q:"“Everyone I know loves this app, so it’s the best one.” What is the flaw?",o:["The sample is small and biased","It uses too many facts","The wording is circular"],a:0,
 x:["The people you know are a small group, and they likely share your tastes. They don’t represent all users or all apps.","The argument offers no real facts at all, just one opinion stretched too far.","Circular means the conclusion is assumed in the premise. Here the problem is the weak evidence, not circularity."]},
{q:"Prices rose after the new mayor took office, so the mayor caused it. What is the flaw?",o:["Coming after something is not the same as being caused by it","Prices can never rise because of a mayor","It relies too much on an expert’s opinion"],a:0,
 x:["Prices may have risen for other reasons, like national inflation. Coming after something doesn’t show it caused the change.","Too strong. A mayor’s policies could affect prices. The problem is that the argument gives no evidence that they did.","No expert is quoted. The argument rests only on timing."]},
{q:"If it rains, the street gets wet. The street is wet. What follows?",o:["It may or may not have rained","It rained","It didn’t rain"],a:0,
 x:["Rain is one way to wet the street, but a sprinkler or a street cleaner could too. A wet street doesn’t prove it rained.","This mistake is called affirming the consequent. The rule says rain leads to a wet street, not that a wet street means rain.","Nothing points to this. Rain is still a perfectly possible cause."]},
{q:"A poll on a gaming website finds that 80% of respondents think video games should be taught in schools. What is the main problem with concluding most people agree?",o:["The respondents were likely to favor games already","80% is too high to be believable","Polls can never be trusted"],a:0,
 x:["People on a gaming site are not a fair cross-section of the public. The sample leans toward people who like games.","High numbers can be real. The issue is who was asked, not how big the number is.","This overcorrects. Well-designed polls with fair samples can be quite reliable."]},
{q:"“My opponent wants to trim the military budget by 2%. So he wants to leave the country defenseless.” What is wrong with this?",o:["It distorts the opponent’s position into an extreme one","Nothing, it follows logically","It relies on an appeal to authority"],a:0,
 x:["A 2% trim is nowhere near leaving the country defenseless. Attacking an exaggerated version of a view is called a straw man.","A small cut does not imply having no defense at all, so it does not follow.","No authority is cited. The trick here is exaggeration, not borrowed credibility."]}],
[{q:"A drug “cuts heart attack risk by 50%.” In the trial, risk fell from 2 in 1,000 people to 1 in 1,000. About how many people must take the drug for one of them to avoid a heart attack?",o:["1,000","2","500","50"],a:0,
 x:["Risk drops by 1 person per 1,000 (2 down to 1). So about 1,000 people must take it for one to benefit. “50%” sounds big only because the starting risk was tiny.","This treats “50%” as if every second person benefits. The real drop is 1 in 1,000.","500 uses the starting risk of 2 in 1,000, but only 1 of those 2 heart attacks is prevented.","No step in the numbers gives 50. It mixes up the percentage with the count."]},
{q:"Crime fell 15% the year after a city put up cameras. Which finding would best show that the cameras caused the drop?",o:["Similar nearby cities without cameras saw no drop that year","Crime also fell 15% in parts of the city with no cameras","Residents say they feel safer","The cameras cost $2 million"],a:0,
 x:["Comparable cities act as a control group. If they stayed flat while this city dropped, the cameras become the likely reason.","This actually weakens the claim. If crime fell just as much where there were no cameras, something else caused the drop.","Feeling safer is about perception, not actual crime. It doesn’t show the cameras changed anything.","Cost has nothing to do with whether the cameras worked."]},
{q:"At one company, the average (mean) salary is $90,000, but the median is $55,000. What best explains this?",o:["A few very high salaries pull the average up","Most employees earn about $90,000","One of the figures must be miscalculated","Most employees earn under $45,000"],a:0,
 x:["A few big salaries raise the mean but barely move the median, which is the middle value. A wide gap like this points to a few very high earners.","The median means half of employees earn $55,000 or less, so most can’t be near $90,000.","Both can be correct. With uneven pay, the mean and median often differ a lot.","The median only says half earn $55,000 or less. It tells you nothing about how many earn under $45,000."]},
{q:"Hospital A has a higher overall survival rate than Hospital B. Yet among mild cases B does better, and among severe cases B also does better. How can that be?",o:["A treats a much larger share of mild cases, which survive more often anyway","One of the numbers must be wrong","B is only better at mild cases","The overall rate is what counts, so the breakdown is misleading"],a:0,
 x:["If most of A’s patients have mild cases, A’s overall rate looks high even though B does better within each group. This is called Simpson’s paradox.","No error is needed. Combining groups of very different sizes can reverse a comparison.","The question says B also does better with severe cases.","The breakdown is more informative here. The overall rate mixes together very different patient groups."]},
{q:"Bombers returning from missions had many bullet holes in the wings and few in the engines. Where should extra armor go?",o:["The engines","The wings, where most holes are","Spread evenly over the plane","Nowhere, the data is too limited"],a:0,
 x:["You only see planes that made it back. Planes hit in the engines probably didn’t return, so the engines are the weak spot. This is called survivorship bias.","Wing holes show where a plane can be hit and still make it home. Those spots need armor least.","This ignores what the pattern tells you about where hits are fatal.","The missing planes are themselves the evidence. The pattern of what survived is very informative."]},
{q:"Students who took a test-prep course averaged 80. Students who didn’t averaged 70. Which fact most weakens the claim that the course raised scores by 10 points?",o:["Students who chose the course already had higher grades beforehand","The course was expensive","Scores in both groups varied widely","The course lasted six weeks"],a:0,
 x:["If stronger students chose the course, they may have scored higher anyway. The groups weren’t equal to begin with, which is called selection bias.","Price doesn’t say anything about whether the course worked.","Spread within each group doesn’t explain why one group averaged higher than the other.","Length doesn’t challenge the claim either way."]},
{q:"Students who eat breakfast score higher on tests. What is the most plausible alternative explanation?",o:["Families with more resources may provide both breakfast and study support","Breakfast makes the test questions easier","High test scores cause students to eat breakfast","The difference must be random chance"],a:0,
 x:["A hidden factor, family resources, could drive both breakfast and higher scores. This is a common confounder.","The test is the same for everyone. Food can’t change the questions.","Breakfast comes before the test, so the test score can’t cause it.","You can’t assume chance without the data. A confounder is a more plausible and testable explanation."]}],
[{q:"A disease affects 1 in 1,000 people. A test catches every case, but it also wrongly flags 1% of healthy people. You test positive. Roughly how likely is it that you have the disease?",o:["About 9%","About 99%","About 50%","About 1%"],a:0,
 x:["Picture 100,000 people. 100 are sick and all test positive. Of the 99,900 healthy people, 1% (about 999) also test positive. So only 100 of about 1,099 positives are sick, roughly 9%.","This mixes up how accurate the test is with what a positive result means. Because the disease is rare, false positives far outnumber real cases.","There’s no reason for an even split. The rarity of the disease drives the answer.","This is the false-positive rate, not the chance that a positive person is sick."]},

{q:"All A are B. Some B are C. Which must be true?",o:["Neither “some A are C” nor “no A are C” is guaranteed","Some A are C","No A are C","Some C are A"],a:0,
 x:["The B’s that are C might or might not include any A’s. Both outcomes fit the statements, so neither is guaranteed.","The B’s that are C could all be non-A’s, so this isn’t guaranteed.","The B’s that are C could include A’s, so this isn’t guaranteed either.","This is the same as “some A are C”, just reversed, so it isn’t guaranteed."]},
{q:"Each card has a letter on one side and a number on the other. Rule: “If a card has a vowel on one side, it has an even number on the other.” The cards show E, K, 4, 7. Which cards must you turn over to test the rule?",o:["E and 7","E and 4","E only","E, 4, and 7"],a:0,
 x:["E could have an odd number on the back, and 7 could have a vowel on the back. Either would break the rule. K and 4 can’t break it.","4 can’t break the rule. The rule doesn’t say even numbers need vowels. Meanwhile 7 could hide a vowel.","This misses 7. A vowel behind 7 would break the rule.","4 is unnecessary. Whatever is behind it, the rule holds."]},
{q:"Linda is 31, outspoken, studied philosophy, and was active in social justice causes. Which is more probable?",o:["Linda is a bank teller","Linda is a bank teller and active in the feminist movement","Both are equally likely","They can’t be compared without more data"],a:0,

const rot=g=>g[0].map((_,c)=>g.map(r=>r[c]).reverse()),flip=g=>g.map(r=>[...r].reverse()),eq=(a,b)=>a.every((r,i)=>r.every((v,j)=>v===b[i][j]));

 do{g=Array.from({length:n},()=>Array(n).fill(0));let c=0;while(c<k){const r=rnd(n),q=rnd(n);if(!g[r][q]){g[r][q]=1;c++}}
  rs=[g,rot(g),rot(rot(g)),rot(rot(rot(g)))];const f=flip(g);fr=[f,rot(f),rot(rot(f)),rot(rot(rot(f)))];
  ok=rs.every((x,i)=>rs.every((y,j)=>i===j||!eq(x,y)))&&fr.every(m=>rs.every(x=>!eq(m,x)))&&fr.every((x,i)=>fr.every((y,j)=>i===j||!eq(x,y)))}while(!ok&&++tries<3000);

 return{q:`Which one is the pattern turned around (rotated), not flipped?<br><span style="display:block;margin:10px 0">${mg(g,1)}</span>`,o:opts.map(o=>mg(o)),a:opts.indexOf(good),g:1}}
const TUT=[[1,1,0],[0,1,0],[0,1,1]];

  const p=$("#pad"),B=[],T=[];let n=0,end=false,start=0;
  const fire=()=>{if(n>=nb){if(ph==0)later(finish,iv*.8);else{p.textContent=`Keep the beat. Tap ${need} times.`;listen=true}return}n++;B.push(performance.now());pulse();if(ph==1)p.textContent=`Beat ${n} of ${nb}`;later(fire,Math.max(10,start+n*iv-performance.now()))};

 const row=k=>{const c=cur(k),b0=S.base[k],d=c-b0;return`<button class="srow" data-r="${k}" style="--c:${CATS[k].c}"><span class="sn"><b>${ANAT[k]}</b><small>${CATS[k].n}</small></span><span class="sb" role="img" aria-label="${ANAT[k]} score ${c}, baseline ${b0}"><i style="width:${c}%"></i><u style="left:${b0}%"></u></span><span class="sv">${c}<small>${d>=0?"+":""}${d}</small></span></button>`};
 return`<h2 style="margin-top:26px">Brain summary</h2><button class="ov${selC==null?" on":""}" data-r="all" style="display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);cursor:pointer"><div class="ovh"><span>Overall brain progress</span><b>${o}</b></div><div class="obar"><i style="width:${o}%"></i></div><p class="mut" style="margin-top:8px">Baseline ${bo}, now ${o} (${dl>=0?"+":""}${dl}). ${S.hist.length} sessions, trained on ${dd} of the last 7 days.</p><p class="mut">Tap to show the entire brain in the visual.</p></button>${KEYS.map(row).join("")}<p class="mut" style="margin-top:10px">Strongest: ${ANAT[order[0]]}. Needs the most work: ${ANAT[order[order.length-1]]}. The white tick on each bar marks your baseline. Brain regions work together as networks, and each task here mainly leans on one region, so treat this mapping as a simplified guide.</p>`}
function vBrain(){const cv=`<div class="cortex"><span class="ctag">cortex /cortx · scan</span><canvas id="bc" role="img" aria-label="Rotatable 3D brain with frontal, parietal, temporal, occipital lobes and cerebellum. Each is a region you are tested on."></canvas></div><div style="display:flex;gap:8px;margin:8px 0 12px"><button class="btn alt sm" id="bz">Reset view</button><button class="btn alt sm" id="bs">Stop spin</button></div>`;
 if(!S.base){const n=KEYS.filter(k=>S.pre[k]!=null).length;return`<h1>Your brain</h1>${S.note?`<p class="mut">CortX now tests more brain regions, so your baseline needs a retake.</p>`:""}<p>${KEYS.length} brain regions, each with its own test. Take the full baseline (about ${totMin()} minutes), or tap a region to test just that one.</p>${cv}<div id="pn" class="blk">${selC?panel(selC):`<p class="mut">Tap a region of the brain.</p>`}</div><button class="btn" id="base"${selC?" hidden":""}>${n?`Continue baseline (${n} of ${KEYS.length} done)`:"Start baseline test"}</button>`}
 const lg=S.hist.slice(-4).reverse().map(h=>`&gt; <em>${h.d}</em> ${SLUG[h.c]} <b>${h.s}</b>`).join("<br>");
 return`<h2>Your brain</h2><p class="mut">Drag to rotate, pinch or scroll to zoom, tap a lobe to see what it does. More colored dots mean a higher score, and the weakest region pulses.</p>${cv}<div id="ch">${chips()}</div><div id="pn" class="blk">${panel(selC)}</div>${summary()}<div class="log"><b>session.log</b><br>${lg}</div>`}

function render(){cancelAnimationFrame(raf);
 $("#nav").innerHTML=[["brain","Brain"],["prog","Progress"],["log","Log"]].map(([k,n])=>`<button class="tab${tab==k?" on":""}" data-tab="${k}">${n}</button>`).join("");
 document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 const m=$("#main");m.innerHTML=tab=="prog"?vProg():tab=="log"?vLog():vBrain();m.scrollTop=0;
 const b1=$("#base");if(b1)b1.onclick=()=>baseline();
 const bc=$("#bc");if(bc){brain(bc,selectC,$("#bz"),$("#bs"));bindPanel()}
 const b2=$("#rebase");if(b2)b2.onclick=()=>{S.pre={};baseline()};
 const sv=$("#savelog");if(sv)sv.onclick=()=>{const g=i=>{const v=parseFloat($(i).value);return isNaN(v)?null:v};
  S.log[today()]={sl:g("#sl"),mv:g("#mv"),sc:g("#sc")};save();render()}}
document.addEventListener("keydown",e=>{
 if(e.repeat||e.target.tagName==="BUTTON")return;
 const st=$("#stage");
 if(!st.hidden){
  const p=$("#pad");
  if(p&&(e.key===" "||(e.key==="Enter"&&!$("#go")))){e.preventDefault();p.dispatchEvent(new Event("pointerdown"));return}
  if(e.key==="Enter"){const b=$("#ok")||$("#go")||$("#fin")||$("#rz");if(b){e.preventDefault();b.click()}}
  else if(/^[1-4]$/.test(e.key)){const b=document.querySelector(`[data-j="${+e.key-1}"]`);if(b)b.click()}
 }else if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("f")){const b=$("#savelog");if(b)b.click()}
});
render();
</script>
</body></html>
